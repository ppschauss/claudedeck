[package]
name = "app"
version = "0.1.0"
description = "ClaudeDeck — SSH/tmux-Terminal-Client für Claude-Code-Sessions"
authors = ["ppschauss"]
license = ""
repository = "https://github.com/ppschauss/claudedeck"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
claudedeck-core = { path = "../crates/claudedeck-core" }
tokio = { version = "1", features = ["sync", "time", "rt"] }
dirs = "6"
data-encoding = "2"

[dev-dependencies]
# Für die Kollisions-Tests von `unique_path` (commands/files.rs) — echte Dateien im Temp-Ordner
# statt eines nachgebauten Dateisystems.
tempfile = "3"
